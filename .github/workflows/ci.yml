# CI minimale (Lot 4, audit L4-2) : typecheck + lint + suite de tests
# AUTONOME (bun scripts/run-tests.ts — les tests auto-portés : fixtures
# locales, aucun service externe requis). La suite E2E (test:e2e, service
# 3003/3004 requis) et le QA DOM (qa:dom, pile + navigateur requis) restent
# des étapes MANUELLES — la CI ne les lance pas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dépendances
        run: bun install

      # Le mini-service a son propre package.json/bun.lock (socket.io, ws,
      # z-ai-web-dev-sdk) : sans cette install, il ne démarre pas sur le
      # runner et les 8 tests à fixture (service auto-porté) échouent tous.
      - name: Dépendances du mini-service (fixtures des tests)
        run: bun install
        working-directory: mini-services/hermes-chat

      # Rendu des artefacts (test-render-pipeline) : chrome-headless-shell
      # installé dans le cache Playwright — l'emplacement exact que
      # render.ts scanne en 2e intention. --with-deps tire les libs système.
      - name: chrome-headless-shell (rendu artefacts)
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Typecheck interface (src/)
        run: bunx tsc --noEmit

      - name: Typecheck mini-service
        run: bunx tsc --noEmit
        working-directory: mini-services/hermes-chat

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests autonomes (runner scripts/test-*.ts)
        run: bun scripts/run-tests.ts
