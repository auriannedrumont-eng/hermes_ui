<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paramètres · Système — maquette v3</title>
<style>
/* ═════════════════════════════════════════════════════════════════
   MAQUETTE SYSTÈME v3 — reprise from scratch (21/11/2026)
   Principes (réponse au brief « rien ne va avec interface/parametres/
   systeme ») :
   1. Une seule question dans la tête de l'utilisateur : « tout va bien,
      et si non, que dois-je faire ? » → deux cartes, une par programme
      (l'application elle-même / Hermes le moteur), pas cinq.
   2. Moins de clics : zéro accordéon ouvert par défaut, zéro repli
      « avancé » visible en état calme. Le repli « autre poste » n'est
      plus un formulaire fantôme : c'est un lien discret qui ouvre une
      vraie étape guidée, uniquement si l'utilisateur l'appelle.
   3. Pas de redondance : la version ne figure qu'à un seul endroit
      (dans le fil de la carte), jamais en ligne séparée + bouton +
      pastille. Le « filet de sécurité » n'est plus une carte : c'est une
      phrase dans le fil au moment où elle est utile.
   4. Zéro jargon : plus de « révision git », « lanceur », « drapeau »,
      « gateway », « socket ». Le mot exact : « l'application », « Hermes ».
   5. « À chaque seconde, l'utilisateur sait ce qui se passe » : pendant
      une mise à jour, la carte devient un FIL en 4 étapes horodatées qui
      défile en direct — phrase humaine + horodatage « il y a 3 s », et
      un garde-fou : aucune nouvelle depuis 30 s → la carte le DIT et
      propose quoi faire (attendre / ouvrir la fenêtre du lanceur).
   Palette et échelle : reprises du panneau Paramètres réel (terracotta
   hermes, pastilles 7 px, texte 12.5/14, cartes border-radius 12).
   ═════════════════════════════════════════════════════════════════ */
:root{
  --bg: #faf9f7; --card: #ffffff; --border: #e7e2dc; --muted: #8a837a;
  --fg: #2b2723; --hermes: #c25e3c; --hermes-strong: #b04e2f;
  --hermes-text: #a34a2c; --hermes-fg: #fff;
  --ok: #2e9e6b; --warn: #b97e14; --err: #cf4436;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1917; --card:#262220; --border:#3d3733; --muted:#a39a90;
    --fg:#f0ece7; --hermes:#d97e57; --hermes-strong:#d97e57;
    --hermes-text:#e08c66; --hermes-fg:#241f1c;
    --ok:#57c28c; --warn:#dfae4e; --err:#ef7b6d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  background:var(--bg); color:var(--fg);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 80px}

/* ── Rail de sections (maquette : contexte visuel du volet Paramètres) ── */
.rail{
  display:flex;gap:4px;overflow-x:auto;margin:-28px -20px 18px;padding:10px 16px;
  background:var(--card);border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail button{
  flex:none;display:flex;align-items:center;gap:7px;border:0;cursor:pointer;
  background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:500;
  padding:7px 11px;border-radius:8px;white-space:nowrap;
}
.rail button:hover{background:var(--bg);color:var(--fg)}
.rail button.on{background:var(--bg);color:var(--fg);font-weight:600}
.rail .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}

/* ── En-tête de page ─────────────────────────────────────────────── */
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.intro{font-size:12.5px;color:var(--muted);margin:0 0 20px;max-width:480px}

/* ── Carte = la brique unique ────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:12px;
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card h2{font-size:14px;font-weight:700;margin:0;display:flex;align-items:center;gap:9px}
.row-fill{flex:1;min-width:200px}

/* ── Pastille (langue d'état unique, reprise de bits.tsx) ────────── */
.pastille{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;white-space:nowrap}
.pastille i{width:7px;height:7px;border-radius:50%;flex:none}
.t-ok i{background:var(--ok)}    .t-ok{color:var(--muted)}
.t-warn i{background:var(--warn)} .t-warn{color:var(--warn)}
.t-err i{background:var(--err)}   .t-err{color:var(--err)}
.t-off i{background:var(--border)} .t-off{color:var(--muted)}
.t-busy i{background:var(--hermes);animation:pulse 1.6s ease-in-out infinite}
.t-busy{color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}

/* ── Fil : LA nouveauté — la carte raconte en continu ────────────── */
.fil{margin-top:10px;font-size:12.5px;color:var(--muted)}
.fil b{color:var(--fg);font-weight:600}
.fil .when{white-space:nowrap}

/* ── Boutons ─────────────────────────────────────────────────────── */
.btn{
  height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--fg);font:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;flex:none;transition:border-color .15s,color .15s;
}
.btn:hover{border-color:var(--hermes);color:var(--hermes-text)}
.btn.primary{
  background:var(--hermes-strong);border-color:var(--hermes-strong);color:var(--hermes-fg);
}
.btn.primary:hover{opacity:.9;border-color:var(--hermes-strong);color:var(--hermes-fg)}
.btn.quiet{border:0;background:transparent;color:var(--muted);height:auto;padding:6px 0;font-weight:600}
.btn.quiet:hover{color:var(--fg)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── Liste des changements (aperçu borné, jamais un mur) ─────────── */
.notes{
  margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:12px;color:var(--muted);max-height:132px;overflow:hidden;position:relative;
}
.notes p{margin:0 0 6px}
.notes .more{
  position:absolute;bottom:0;left:0;right:0;height:34px;
  background:linear-gradient(transparent,var(--card));
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;
}

/* ── Fil de mise à jour en direct (le « compteur de vie ») ──────── */
.live{
  margin-top:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden;
}
.live-steps{padding:6px 14px 2px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.step i{
  width:17px;height:17px;border-radius:50%;border:2px solid var(--border);flex:none;
  display:grid;place-items:center;font-size:9px;font-style:normal;color:var(--hermes-fg);
}
.step.done{color:var(--fg)} .step.done i{background:var(--ok);border-color:var(--ok)}
.step.now{color:var(--hermes-text)} .step.now i{border-color:var(--hermes);animation:pulse 1.6s infinite}
.step-sep{width:22px;height:2px;border-radius:2px;background:var(--border);flex:none}
.step-sep.done{background:var(--ok)}
.live-feed{
  border-top:1px solid var(--border);padding:10px 14px 12px;background:var(--bg);
}
.live-feed p{margin:0;font-size:12.5px;display:flex;gap:10px;align-items:baseline}
.live-feed .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;opacity:.8}
.live-feed .ago{font-size:11px;color:var(--muted);margin-left:auto;flex:none}
.live-feed .cur{color:var(--fg)}
.live-feed .cur::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--hermes);margin-right:8px;vertical-align:1px;
  animation:pulse 1.6s infinite;
}
.live-feed .ok::before{content:"✓";color:var(--ok);margin-right:8px;font-weight:700}
.live-feed .ko::before{content:"✕";color:var(--err);margin-right:8px;font-weight:700}
.stallnote{
  margin:8px 14px 12px;padding:8px 12px;border-radius:8px;
  background:color-mix(in srgb, var(--warn) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  font-size:12px;color:var(--warn);font-weight:500;
}

/* ── Repli discret (seul « plus de clic » assumé, payé une fois) ── */
.fold{
  margin-top:6px;border:0;background:none;padding:0;color:var(--muted);
  font:inherit;font-size:12px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
}
.fold:hover{color:var(--fg)}
.fold svg{transition:transform .2s}
.fold[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ── Étape guidée « autre poste » (remplace le formulaire fantôme) ── */
.guide{margin-top:12px;border:1px dashed var(--border);border-radius:10px;padding:14px 16px}
.guide h3{font-size:13px;font-weight:700;margin:0 0 4px}
.guide p{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.guide label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.guide input{
  width:100%;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--card);
  color:var(--fg);font:inherit;font-size:12.5px;padding:0 10px;outline:none;
}
.guide input:focus{border-color:var(--hermes)}

/* ── Bandeau maquette (hors produit) ─────────────────────────────── */
.proto{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;
  background:var(--fg);color:var(--bg);border-radius:99px;padding:8px 16px;
  font-size:11.5px;font-weight:600;display:flex;gap:10px;align-items:center;
  box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 28px);
}
.proto button{
  border:0;background:none;color:inherit;font:inherit;font-weight:700;cursor:pointer;
  padding:2px 6px;border-radius:6px;opacity:.75;
}
.proto button:hover{opacity:1;background:rgba(255,255,255,.12)}
.proto button.on{opacity:1;background:rgba(255,255,255,.18)}
.proto .sep{opacity:.3}
@media(max-width:560px){
  .proto{font-size:10.5px;padding:7px 10px;gap:6px;flex-wrap:wrap;justify-content:center;border-radius:12px}
}

/* Petit écran : les actions passent sous le texte, pleine largeur */
@media(max-width:560px){
  .card-top{flex-direction:column;align-items:stretch}
  .actions{justify-content:stretch}
  .actions .btn{flex:1;text-align:center;min-width:130px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Rail du volet Paramètres (contexte : « Système » est une section
       parmi 11 — la maquette n'en montre que l'entrée active) -->
  <nav class="rail" aria-label="Sections des paramètres">
    <button>Interface</button><button>Modèles</button><button>Modes de chat</button>
    <button>Fournisseurs</button><button>Clés de services</button><button>Chats web</button>
    <button>Outils &amp; extensions</button><button>Hermes</button><button>Profils</button>
    <button class="on"><span class="dot" aria-hidden></span>Système</button><button>Stockage</button>
  </nav>

  <h1>Système</h1>
  <p class="intro">Deux programmes travaillent pour vous&nbsp;: cette application, et Hermes.
  Chacun se met à jour en un clic, et vous dit tout, en direct.</p>

  <!-- ══════════════════════════════════════════════════════════════
       CARTE 1 — L'APPLICATION (interface hermes_ui)
       Un seul objet, un seul verbe. État calme = 2 lignes.
       ══════════════════════════════════════════════════════════════ -->
  <section class="card" id="card-app" aria-labelledby="t-app">
    <div class="card-top">
      <div class="row-fill">
        <h2 id="t-app">L'application <span class="pastille" id="app-past"><i aria-hidden></i><span id="app-past-label">…</span></span></h2>
        <p class="fil" id="app-fil">…</p>
      </div>
      <div class="actions" id="app-actions"></div>
    </div>
    <div id="app-extra"></div>
  </section>

  <!-- ══════════════════════════════════════════════════════════════
       CARTE 2 — HERMES (le moteur)
       Même grammaire que la carte 1 : l'utilisateur n'a qu'une
       grammaire à apprendre. Les détails (changelogs, documents
       générés, autre poste) sont des liens du fil, pas des panneaux.
       ══════════════════════════════════════════════════════════════ -->
  <section class="card" id="card-motor" aria-labelledby="t-motor">
    <div class="card-top">
      <div class="row-fill">
        <h2 id="t-motor">Hermes <span class="pastille" id="motor-past"><i aria-hidden></i><span id="motor-past-label">…</span></span></h2>
        <p class="fil" id="motor-fil">…</p>
      </div>
      <div class="actions" id="motor-actions"></div>
    </div>
    <div id="motor-extra"></div>
    <!-- Le carnet de bord reste (c'est le point fort du v0.4) mais il
         devient un repli de LA carte Hermes : plus de carte séparée,
         plus de redite « l'interface note chaque étape… ». -->
    <button class="fold" id="log-fold" aria-expanded="false" aria-controls="log-body">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
      <span id="log-fold-label">Historique</span>
    </button>
    <div id="log-body" hidden>
      <div class="guide" style="margin-top:8px">
        <p style="margin:0" id="log-list">…</p>
      </div>
    </div>
  </section>

</div>

<!-- Bandeau de pilotage de la maquette (hors produit) -->
<div class="proto" role="group" aria-label="Scénarios de la maquette">
  <span>Maquette</span><span class="sep">·</span>
  <button data-sc="calme" class="on">Tout à jour</button>
  <button data-sc="dispo">Mises à jour</button>
  <button data-sc="maj">Mise à jour en cours</button>
  <button data-sc="stall">Silence 30 s</button>
  <button data-sc="pb">Problème</button>
</div>

<script>
/* ═════════════════════════════════════════════════════════════════
   Scénarios de la maquette. Les libellés et timings sont réalistes
   (dérivés des durées réelles du lanceur et de `hermes update`) :
   le but est de valider les TEXTES et le rythme d'affichage.
   ═════════════════════════════════════════════════════════════════ */
"use strict";
const $ = (id) => document.getElementById(id);

/* ── Aide de rendu : pastille + fil ─────────────────────────────── */
function setPastille(card, tone, label){
  const p = $(card === "app" ? "app-past" : "motor-past");
  p.className = "pastille t-" + tone;
  p.querySelector("span").textContent = label;
}
function setFil(card, html){
  $(card === "app" ? "app-fil" : "motor-fil").innerHTML = html;
}
function setActions(card, html){
  $(card === "app" ? "app-actions" : "motor-actions").innerHTML = html;
}
function setExtra(card, html){
  $(card === "app" ? "app-extra" : "motor-extra").innerHTML = html;
}

/* Horodatage « il y a Ns » qui vit — la preuve que la carte respire. */
const T0 = Date.now();
function ago(ts){ return "il y a " + Math.max(1, Math.round((Date.now() - ts)/1000)) + " s"; }
setInterval(() => {
  document.querySelectorAll("[data-ago]").forEach((el) => {
    el.textContent = ago(Number(el.dataset.ago));
  });
}, 1000);
window.__ago = ago;

/* ── Étapes du fil live (mêmes 4 étapes pour les 2 cartes : une
      grammaire unique — demande → téléchargement → installation →
      vérification) ───────────────────────────────────────────────── */
function stepsHtml(cur){ /* cur = index de l'étape active, -1 = fini ok */
  const labels = ["Demande envoyée", "Téléchargement", "Installation", "Vérification"];
  let h = "";
  labels.forEach((l, i) => {
    const done = cur === -1 || i < cur;
    const now = i === cur;
    if (i > 0) h += `<span class="step-sep ${done ? "done" : ""}" aria-hidden></span>`;
    h += `<span class="step ${done ? "done" : ""} ${now ? "now" : ""}"><i>${done ? "✓" : ""}</i>${l}</span>`;
  });
  return h;
}

/* Ligne du fil live : phrase humaine + horodatage vivant. */
function feedLine(text, cls, ts){
  return `<p class="${cls}"><span class="t">${new Date(ts).toLocaleTimeString("fr-FR")}</span>` +
         `<span class="w">${text}</span><span class="ago" data-ago="${ts}">${ago(ts)}</span></p>`;
}

/* ── SCÉNARIO « calme » ─────────────────────────────────────────── */
function scCalme(){
  /* Application : à jour, vérifié il y a 4 h — le fil suffit. */
  setPastille("app", "ok", "À jour");
  setFil("app", `Dernière vérification&nbsp;: aujourd'hui à <b>09:12</b>.`);
  setActions("app", `<button class="btn">Vérifier maintenant</button>`);
  setExtra("app", "");

  /* Hermes : à jour + la phrase « filet de sécurité » intégrée au fil. */
  setPastille("motor", "ok", "À jour");
  setFil("motor",
    `Version <b>4.2.1</b>, vérifiée aujourd'hui à <b>09:12</b>. ` +
    `La version d'avant (<b>4.2.0</b>) reste en réserve&nbsp;: ` +
    `<a href="#" onclick="return false" style="color:var(--hermes-text);font-weight:600">revenir en arrière</a> si besoin.`);
  setActions("motor", `<button class="btn">Vérifier maintenant</button>`);
  setExtra("motor", "");
  setLog([
    ["21/11 · 09:12", "Vérification — tout est à jour", "ok"],
    ["18/11 · 17:40", "Hermes mis à jour&nbsp;: 4.1.9 → 4.2.1, contrôle réussi", "ok"],
    ["18/11 · 17:38", "Mise à jour de l'application installée", "ok"],
  ]);
}

/* ── SCÉNARIO « dispo » ─────────────────────────────────────────── */
function scDispo(){
  setPastille("app", "warn", "Mise à jour disponible");
  setFil("app",
    `Une nouvelle version est prête. Un clic, et tout se fait tout seul ` +
    `(1 à 2 minutes, l'application redémarre à la fin).`);
  setActions("app", `<button class="btn primary">Mettre à jour</button>`);
  setExtra("app", notesBlock(
    "Ce qui change dans cette version",
    ["Le panneau des documents générés s'ouvre plus vite.",
     "Corrigé&nbsp;: les conversations ne disparaissaient plus au rechargement.",
     "Nouveau&nbsp;: export d'une conversation au format PDF."],
    "Voir la liste complète sur GitHub"));

  setPastille("motor", "warn", "Mise à jour disponible");
  setFil("motor",
    `Hermes <b>4.3.0</b> est disponible (vous avez la <b>4.2.1</b>). ` +
    `La version actuelle est mise de côté avant tout changement&nbsp;: ` +
    `le retour arrière restera possible.`);
  setActions("motor", `<button class="btn primary">Mettre Hermes à jour</button>`);
  setExtra("motor", notesBlock(
    "Ce qui change dans Hermes 4.3.0",
    ["Meilleure gestion des documents longs.",
     "Corrigé&nbsp;: blocage possible en mode débat.",
     "⚠ Cette version touche la liaison avec l'application — un contrôle automatique suivra la mise à jour."],
    "Voir la liste complète sur GitHub"));
  setLog([
    ["21/11 · 09:12", "Nouvelles versions repérées (application + Hermes)", "info"],
    ["18/11 · 17:40", "Hermes mis à jour&nbsp;: 4.1.9 → 4.2.1, contrôle réussi", "ok"],
  ]);
}

/* Aperçu borné des changements : 3 lignes + lien, jamais un mur. */
function notesBlock(title, lines, link){
  return `<div class="notes">
    <p style="font-weight:600;color:var(--fg);font-size:12.5px">${title}</p>
    ${lines.map((l) => `<p>· ${l}</p>`).join("")}
    <div class="more"><a href="#" onclick="return false" style="color:var(--hermes-text);font-weight:600;font-size:12px">${link} →</a></div>
  </div>`;
}

/* ── SCÉNARIO « maj en cours » — LE cœur du brief ───────────────── */
/* Chaque étape affiche : une phrase humaine, un âge vivant, et le
   marqueur d'étape qui avance. Jouer ce scénario = regarder la mise
   à jour vivre. En vrai, les lignes viennent du journal du service. */
let majTimer = null;
function killMaj(){ if (majTimer){ clearInterval(majTimer); majTimer = null; } }
function scMaj(){
  killMaj();
  const now = Date.now();
  setPastille("app", "busy", "Mise à jour en cours…");
  setFil("app", `Pas besoin d'attendre ici&nbsp;: tout se fait tout seul. ` +
    `Vous pouvez continuer à discuter avec Hermes.`);
  setActions("app", ``);
  setExtra("app", `<div class="live">
    <div class="live-steps" id="maj-steps">${stepsHtml(0)}</div>
    <div class="live-feed" id="maj-feed">
      ${feedLine("C'est parti — recherche de la nouvelle version…", "cur", now)}
    </div>
  </div>`);

  /* Déroulé réaliste (accéléré ×4 pour la démo — en vrai : étapes de
     5 à 40 s). Les textes sont ceux que le service écrirait. */
  const script = [
    [4,  0, "Nouvelle version trouvée — téléchargement en cours…"],
    [9,  1, "Téléchargement terminé (24 Mo) — installation…"],
    [13, 2, "Installation des nouveaux fichiers…"],
    [17, 2, "Redémarrage de l'application (la connexion coupe une dizaine de secondies, c'est normal)…"],
    [22, 3, "L'application revient — vérification que tout fonctionne…"],
    [26, -1, "C'est terminé — la nouvelle version est installée. <b>Rechargez la page</b> pour la découvrir."],
  ];
  let i = 0;
  const play = () => {
    const [at, step, text] = script[i];
    if (step >= 0) $("maj-steps").innerHTML = stepsHtml(step);
    const feed = $("maj-feed");
    feed.querySelector(".cur")?.classList.remove("cur");
    feed.insertAdjacentHTML("beforeend",
      feedLine(text, step === -1 ? "ok" : "cur", now + at * 1000));
    if (step === -1){
      killMaj();
      setPastille("app", "ok", "Mise à jour installée");
      setFil("app", `Terminé à <b>${new Date().toLocaleTimeString("fr-FR")}</b> — ` +
        `votre version d'avant reste en réserve si vous changez d'avis.`);
      setActions("app", `<button class="btn primary" onclick="location.reload()">Recharger la page</button>`);
      /* Hermes reste à jour pendant ce scénario. */
      setPastille("motor", "ok", "À jour");
      setFil("motor", `Version <b>4.2.1</b>. Pendant la mise à jour de l'application, Hermes continue de travailler normalement.`);
      setActions("motor", ``);
      setExtra("motor", "");
    }
    i++;
    if (i < script.length) majTimer = setTimeout(play, (script[i][0] - at) * 1000);
  };
  majTimer = setTimeout(play, 4000);
}

/* Variante « silence inquiétant » : aucune nouvelle depuis 30 s →
   la carte le DIT et dit quoi faire. Visible via le 5e bouton démo. */
function scStall(){
  killMaj();
  const ts = Date.now() - 46000;
  setPastille("app", "busy", "Mise à jour en cours…");
  setFil("app", `Pas besoin d'attendre ici&nbsp;: tout se fait tout seul.`);
  setActions("app", ``);
  setExtra("app", `<div class="live">
    <div class="live-steps">${stepsHtml(1)}</div>
    <div class="live-feed">
      ${feedLine("C'est parti — recherche de la nouvelle version…", "", ts)}
      ${feedLine("Nouvelle version trouvée — téléchargement en cours…", "", ts + 6000)}
      ${feedLine("Téléchargement terminé (24 Mo) — installation…", "cur", ts + 15000)}
    </div>
    <div class="stallnote" role="alert">
      Aucune nouvelle depuis <b>31 secondes</b>. Ce n'est probablement rien (certaines
      étapes sont longues), mais si rien ne bouge d'ici une minute&nbsp;:
      regardez si la fenêtre «&nbsp;Hermes Web&nbsp;» (le petit programme qui installe
      les mises à jour) attend une réponse de votre part.
    </div>
  </div>`);
}

/* ── SCÉNARIO « problème » ──────────────────────────────────────── */
function scPb(){
  setPastille("app", "ok", "À jour");
  setFil("app", `Dernière vérification&nbsp;: aujourd'hui à <b>09:12</b>.`);
  setActions("app", `<button class="btn">Vérifier maintenant</button>`);
  setExtra("app", "");

  setPastille("motor", "err", "Hermes ne répond plus");
  setFil("motor",
    `Depuis la mise à jour de tout à l'heure, l'application n'arrive plus à ` +
    `joindre Hermes. <b>Vos conversations et vos documents sont intacts.</b>`);
  setActions("motor",
    `<button class="btn primary">Revenir à la version d'avant (4.2.1)</button>` +
    `<button class="btn">Revérifier</button>`);
  setExtra("motor", `<div class="guide" style="border-style:solid">
    <h3>Deux façons de s'en sortir</h3>
    <p style="margin-bottom:10px">La plus simple d'abord — le retour arrière utilise la
    procédure officielle de Hermes et ne touche à rien d'autre.</p>
    <p style="margin:0;font-size:12px">Si vous préférez décrire le problème à la personne
    qui maintient l'application&nbsp;:
    <a href="#" onclick="return false" style="color:var(--hermes-text);font-weight:600">préparer un message prêt à copier</a>.</p>
  </div>`);
  setLog([
    ["21/11 · 11:02", "Contrôle après mise à jour — Hermes injoignable", "ko"],
    ["21/11 · 11:00", "Hermes mis à jour&nbsp;: 4.2.1 → 4.3.0", "info"],
    ["21/11 · 09:12", "Vérification — tout est à jour", "ok"],
  ]);
}

/* ── Historique (ex « carnet de bord ») ─────────────────────────── */
function setLog(rows){
  $("log-fold-label").textContent = "Historique · " + rows.length + " étapes";
  $("log-list").innerHTML = rows.map(([d, t, r]) => {
    const c = r === "ok" ? "var(--ok)" : r === "ko" ? "var(--err)" : "var(--muted)";
    return `<span style="display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px">
      <span style="font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none">${d}</span>
      <span style="flex:1">${t}</span>
      <span style="color:${c};font-size:11px;font-weight:600;flex:none">${r === "ok" ? "✓" : r === "ko" ? "✕" : "·"}</span>
    </span>`;
  }).join("");
}
$("log-fold").addEventListener("click", () => {
  const open = $("log-body").hidden;
  $("log-body").hidden = !open;
  $("log-fold").setAttribute("aria-expanded", String(open));
});

/* ── Repli « autre poste » (lien du fil Hermes, pas un panneau) ──── */
/* En état calme, un lien discret dans le fil Hermes ouvre l'étape
   guidée. Ici codé dans le scénario « calme » via un bouton démo. */

/* ── Aiguillage des scénarios ───────────────────────────────────── */
const SCEN = {
  calme: scCalme, dispo: scDispo, maj: scMaj, stall: scStall, pb: scPb,
};
document.querySelectorAll(".proto button[data-sc]").forEach((b) => {
  b.addEventListener("click", () => {
    killMaj();
    document.querySelectorAll(".proto button[data-sc]").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    SCEN[b.dataset.sc]();
  });
});
scCalme();
</script>
